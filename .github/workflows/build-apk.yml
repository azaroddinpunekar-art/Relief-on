name: Build RELIEF Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract RELIEF source
        run: unzip -q "relief-source (1).zip" -d .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fix Vite and esbuild dependency conflict
        working-directory: relief-app
        run: npm pkg set 'devDependencies.esbuild=^0.27.0'

      - name: Install dependencies
        working-directory: relief-app
        run: npm install

      - name: Build web application
        working-directory: relief-app
        run: npm run build

      - name: Install Capacitor Android
        working-directory: relief-app
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Create and sync Android project
        working-directory: relief-app
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: relief-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload RELIEF APK
        uses: actions/upload-artifact@v4
        with:
          name: RELIEF-android-apk
          path: relief-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
