
name: Build RELIEF Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: ./relief-app
        run: npm install

      - name: Build web assets
        working-directory: ./relief-app
        run: npm run build

      - name: Setup Capacitor Android
        working-directory: ./relief-app
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: ./relief-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload RELIEF APK
        uses: actions/upload-artifact@v4
        with:
          name: RELIEF-android-apk
          path: relief-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
