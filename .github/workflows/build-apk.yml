
name: Build RELIEF APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract RELIEF source
        run: unzip -q "relief-source (1).zip" -d .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: relief-app
        run: npm install

      - name: Install Capacitor
        working-directory: relief-app
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web application
        working-directory: relief-app
        run: npm run build

      - name: Create Android project
        working-directory: relief-app
        run: npx cap add android

      - name: Sync Android
        working-directory: relief-app
        run: npx cap sync android

      - name: Build APK
        working-directory: relief-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RELIEF-APK
          path: relief-app/android/app/build/outputs/apk/debug/app-debug.apk
          
